<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
		#dashboard {
    position: absolute;
    z-index: 9999;
    top: 15px;
    left: 15px;
    width: 330px;
    max-height: calc(100vh - 30px);
    overflow-y: auto;
    background: rgba(255,255,255,.97);
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
    padding: 15px;
    font-family: Arial, sans-serif;
}

.dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    margin-bottom: 15px;
}

#dashboard-close {
    border: 0;
    background: transparent;
    font-size: 24px;
    cursor: pointer;
}

#dashboard-toggle {
    position: absolute;
    z-index: 9998;
    top: 15px;
    left: 15px;
    display: none;
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    background: white;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
    cursor: pointer;
    font-size: 18px;
}

.filter-group label {
    display: block;
    margin-top: 8px;
    margin-bottom: 4px;
    font-size: 12px;
    font-weight: bold;
}

.filter-group select {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: white;
}

#summary {
    display: flex;
    gap: 8px;
    margin: 15px 0;
}

.summary-card {
    flex: 1;
    padding: 10px;
    background: #f3f4f6;
    border-radius: 8px;
    text-align: center;
}

.summary-card span {
    display: block;
    font-size: 11px;
    color: #666;
}

.summary-card strong {
    display: block;
    margin-top: 4px;
    font-size: 20px;
}

.chart-title {
    font-weight: bold;
    margin: 10px 0;
}

#ward-chart {
    width: 100%;
    height: 220px;
}

#legend {
    margin-top: 10px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 5px 0;
    font-size: 12px;
}

.legend-color {
    width: 13px;
    height: 13px;
    border-radius: 50%;
}

.customer-popup {
    min-width: 250px;
}

.customer-popup table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

.customer-popup td {
    padding: 4px;
    border-bottom: 1px solid #eee;
}

.customer-popup td:first-child {
    font-weight: bold;
    width: 42%;
}

.gps-button {
    display: block;
    margin-top: 10px;
    padding: 9px;
    text-align: center;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}

@media (max-width: 600px) {
    #dashboard {
        width: calc(100% - 30px);
    }
}
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>

<div id="dashboard">
    <div class="dashboard-header">
        <b>Customer Map</b>
        <button id="dashboard-close">×</button>
    </div>

    <div class="filter-group">
        <label>City</label>
        <select id="filter-city">
            <option value="">Semua City</option>
        </select>

        <label>District</label>
        <select id="filter-district">
            <option value="">Semua District</option>
        </select>

        <label>Ward</label>
        <select id="filter-ward">
            <option value="">Semua Ward</option>
        </select>
    </div>

    <div id="summary">
        <div class="summary-card">
            <span>Total Customer</span>
            <strong id="total-customer">0</strong>
        </div>

        <div class="summary-card">
            <span>Total Ward</span>
            <strong id="total-ward">0</strong>
        </div>

	</div>

<div class="chart-title">
    Customer berdasarkan Status
</div>
	
    <canvas id="ward-chart"></canvas>

    <div id="legend"></div>
</div>

<button id="dashboard-toggle">📊</button>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/SIDOARJO_1.js"></script>
        <script src="layers/surabaya_2.js"></script>
        <script src="styles/SIDOARJO_1_style.js"></script>
        <script src="styles/surabaya_2_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>        
        <script src="./resources/customer-map.js"></script>    
	</body>
</html>
